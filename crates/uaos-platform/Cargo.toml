# SPDX-License-Identifier: Apache-2.0
[package]
name = "uaos-platform"
description = "UAOS platform boundary: the only crate that touches clocks, randomness, the filesystem, processes and OS facilities. Real and deterministic-simulation implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
getrandom.workspace = true
keyring-core.workspace = true
thiserror.workspace = true
zeroize.workspace = true
uaos-contracts.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# Windows only: use the NASM objects AWS ships inside the aws-lc-sys crate package instead of
# requiring NASM on every Windows machine (ADR-0006). Other targets assemble from source.
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { workspace = true, features = ["prebuilt-nasm"] }
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true
