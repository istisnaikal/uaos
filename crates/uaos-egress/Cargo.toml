# SPDX-License-Identifier: Apache-2.0
[package]
name = "uaos-egress"
description = "UAOS egress door: the only outbound path. Owns DNS (resolve, verify, pin), refuses private and special-purpose ranges, never follows redirects, adds no UAOS headers, injects provider credentials last."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-rustls.workspace = true
tower-service.workspace = true
uaos-contracts.workspace = true
uaos-platform.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
proptest.workspace = true
rcgen.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }

[lints]
workspace = true
