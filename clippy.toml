  { path = "tokio::net::TcpSocket::listen", reason = "only the API crate listens, on loopback (owner: uaos-api)" },
  { path = "tokio::net::UnixSocket::connect", reason = "outbound connections go through the egress door (owner: uaos-egress)", allow-invalid = true },
  { path = "std::os::unix::net::UnixStream::connect_addr", reason = "outbound connections go through the egress door (owner: uaos-egress)", allow-invalid = true },
  { path = "tokio::net::windows::named_pipe::ClientOptions::open", reason = "outbound connections go through the egress door (owner: uaos-egress)", allow-invalid = true },
  { path = "std::os::unix::net::UnixStream::connect", reason = "outbound connections go through the egress door (owner: uaos-egress)", allow-invalid = true },
  { path = "tokio::net::UnixStream::connect", reason = "outbound connections go through the egress door (owner: uaos-egress)", allow-invalid = true },
  # Review WP3.A5 round 5, M2: the remaining local-IPC sockets (Unix streams by address, Unix
  # datagrams, std's needing no dependency at all) and the local listeners (Unix listeners and
