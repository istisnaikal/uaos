disallowed-types = [
  # Random iteration order is hidden nondeterminism; it breaks seed-reproducible simulation.
  { path = "std::collections::HashMap", reason = "use BTreeMap (deterministic order) or justify with #[allow]" },
  { path = "std::collections::HashSet", reason = "use BTreeSet (deterministic order) or justify with #[allow]" },
  # Task sets spawn through `collect` and `extend` too, which no method ban can name (round 3, L3).
  { path = "tokio::task::JoinSet", reason = "spawn via the runtime supervisor (owner: uaos-runtime)" },
  { path = "tokio::task::LocalSet", reason = "spawn via the runtime supervisor (owner: uaos-runtime)" },
  # hyper-util's executor spawns every task it is given with `tokio::spawn` (round 4, L1).
  { path = "getrandom::SysRng", reason = "randomness comes from uaos_platform::Rng (owner: uaos-platform)" },
  { path = "hyper_util::rt::TokioExecutor", reason = "spawn via the runtime supervisor (owner: uaos-runtime)" },
]
