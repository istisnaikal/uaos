  { path = "hyper_util::client::legacy::connect::HttpConnector::new", reason = "the egress door is the only HTTP client; it owns DNS and classification (owner: uaos-egress)" },
  { path = "hyper_util::client::legacy::Builder::build_http", reason = "the egress door is the only HTTP client; it owns DNS and classification (owner: uaos-egress)" },
  { path = "hyper_util::client::legacy::connect::HttpConnector::new_with_resolver", reason = "the egress door is the only HTTP client; it owns DNS and classification (owner: uaos-egress)" },
  # Review WP3.A5 round 3: hyper-util's own resolver (a DNS lookup on the blocking pool), a raw
