  { path = "std::fs::rename", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::create_dir_all", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::File::create", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::File::open", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::OpenOptions::open", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  # Review WP3.A5 round 6, M1: every other file-system and path query or change. On Windows a
