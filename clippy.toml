#
# Architecture is enforced here, not in review comments (plan §4.3, D2, D15).
# Each ban names the ONE crate allowed to cross it. Inside that crate the crossing must be
# an item-level `#[allow(clippy::disallowed_methods, reason = "...")]`.
# `cargo xtask allow-audit` checks owners per lint, not per method: a file that owns one
# disallowed method may allow any of them. Review of each `allow` and its reason covers the rest.
# Paths for crates that are not dependencies yet (reqwest) are added in the phase that
# introduces them. Clippy only warns about a path that resolves to nothing, and `-D warnings`
# does not make that fatal, so the gate runs as `cargo xtask clippy`, which fails on it (review
# WP3.A5, round 4, M1). Some broken paths draw no warning at all (a first segment that names no
# crate, or an `allow-invalid` entry, which exists only on some systems), so every ban here also
# has a canary in `crates/uaos-egress/tests/bans.rs` (or `uaos-platform`'s): a call under
# `#[expect]` that fails clippy wherever the ban stops firing (round 5, L2).

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-methods = [
