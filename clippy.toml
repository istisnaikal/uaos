#
# Architecture is enforced here, not in review comments (plan §4.3, D2, D15).
# Each ban names the ONE crate allowed to cross it. Inside that crate the crossing must be
# an item-level `#[allow(clippy::disallowed_methods, reason = "...")]`.
# Paths for crates that are not dependencies yet (tokio, reqwest) are added in the phase that
# introduces them, because clippy rejects unresolvable paths.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-methods = [
  # Time and randomness come from uaos_platform::{Clock, Rng} so DST is seed-reproducible (D15).
  { path = "std::time::SystemTime::now", reason = "use uaos_platform::Clock (owner: uaos-platform)" },
  { path = "std::time::Instant::now", reason = "use uaos_platform::Clock (owner: uaos-platform)" },
  { path = "getrandom::fill", reason = "use uaos_platform::Rng (owner: uaos-platform)" },
  # Concurrency: the supervisor is the sole spawner (D2).
  { path = "std::thread::spawn", reason = "spawn via the runtime supervisor (owner: uaos-runtime)" },
  # Processes: only through the platform spawner / sandbox broker (D9).
  { path = "std::process::Command::new", reason = "spawn via uaos_platform::Spawn (owner: uaos-platform)" },
  # Filesystem: only through uaos_platform::Fs so faults can be injected (D15).
  { path = "std::fs::write", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::read", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::read_to_string", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::remove_file", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::rename", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::create_dir_all", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::File::create", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::File::open", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::fs::OpenOptions::open", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  # Hidden inputs: configuration arrives through uaos-config snapshots, not ambient env reads.
  { path = "std::env::var", reason = "read config via the composition root (owner: uaos bin)" },
  { path = "std::env::var_os", reason = "read config via the composition root (owner: uaos bin)" },
]

disallowed-types = [
  # Random iteration order is hidden nondeterminism; it breaks seed-reproducible simulation.
  { path = "std::collections::HashMap", reason = "use BTreeMap (deterministic order) or justify with #[allow]" },
  { path = "std::collections::HashSet", reason = "use BTreeSet (deterministic order) or justify with #[allow]" },
]
