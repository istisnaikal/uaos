  { path = "std::fs::DirBuilder::create", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::exists", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::try_exists", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::metadata", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::symlink_metadata", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::read_dir", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
  { path = "std::path::Path::canonicalize", reason = "use uaos_platform::Fs (owner: uaos-platform)" },
