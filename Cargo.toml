# SPDX-License-Identifier: Apache-2.0
#
# UAOS workspace. Ring 0 kernel crates live in crates/, Ring 1 modules in modules/.
# Dependency direction is enforced by `cargo xtask arch-check` against arch.toml (ADR-0001).

[workspace]
resolver = "3"
# `modules/*` (Ring 1) joins the member list with the first module in P3.
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["The UAOS Authors"]
publish = false

[workspace.dependencies]
# Internal
uaos-contracts = { path = "crates/uaos-contracts" }
uaos-platform = { path = "crates/uaos-platform" }
uaos-state = { path = "crates/uaos-state" }

# External — every addition needs a justification in the PR (CONTRIBUTING.md §Dependencies).
# aws-lc-rs: the single audited crypto family for TLS and primitives (plan D18).
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] }
cargo_metadata = "0.23.1"
getrandom = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
proptest = "1.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.28.0", default-features = false, features = ["std", "serde"] }

[workspace.lints.rust]
# `unsafe` is denied everywhere; the only escape hatch is `#[allow(unsafe_code)]` inside
# `uaos-platform::os` (and from P5 `uaos-sandbox::os`), each with ADR + SAFETY comment.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction set (plan §4.3). CI runs clippy with `-D warnings`, so every warning blocks a merge.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
undocumented_unsafe_blocks = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
exit = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind" # module boundaries catch panics (plan §2.8); never abort silently.
