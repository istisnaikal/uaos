# SPDX-License-Identifier: Apache-2.0
#
# Nightly deep lane (plan §4.2): the expensive versions of merge-lane proofs.

name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  durability:
    # 10,000 real kills of the production journal per OS (the P1 bar in ADR-0003), plus the
    # deterministic crash simulation at 20,000 scenarios per flush policy.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Kill harness (10,000 kills)
        run: cargo test -p uaos-testkit --release --locked --test kill -- --nocapture
        env:
          UAOS_CRASH_ITERATIONS: "10000"
          UAOS_CRASH_SEED: ${{ github.run_id }}
      - name: Crash simulation (20,000 scenarios per policy)
        run: cargo test -p uaos-state --release --locked --test journal simulation
        env:
          UAOS_SIM_CASES: "20000"
      - name: Ledger simulation (100,000 schedules)
        run: cargo test -p uaos-ledger --release --locked --test ledger simulation
        env:
          UAOS_SIM_CASES: "100000"
      - name: Redaction corpus (fresh seed; merge runs pin corpus v1)
        run: cargo test -p uaos-redact --release --locked --test corpus -- --nocapture
        env:
          UAOS_CORPUS_SEED: ${{ github.run_id }}
