# SPDX-License-Identifier: Apache-2.0
name: Bug
description: Something behaves differently from its documented contract.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps or a sanitized transcript. Never paste real keys or private data.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Output of `uaos doctor --report` (redacted bundle; review it before pasting) and `uaos --version`.
  - type: input
    id: correlation
    attributes:
      label: Correlation ID (if any)
