# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain policy (plan §4.4, T3). Anything not allowed here fails the merge.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception names its advisory, why it cannot be fixed now, and when it ends.
ignore = [
  # zbus 6.0.0 (2026-10-16) absorbed zvariant, zbus_names and zvariant_derive. They reach us only
  # through the Linux keyring store: zbus-secret-service-keyring-store 1.0.1 -> secret-service
  # 5.2.0 -> zbus 5, and neither has a release on zbus 6 as of 2026-10-18. Unmaintained, not a
  # vulnerability. Remove these when the keyring store moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; the keyring store is still on zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; the keyring store is still on zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; the keyring store is still on zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Every entry must be compatible with distributing an Apache-2.0 binary. Notices are aggregated in
# NOTICE at release time. MPL-2.0 is file-level copyleft: allowed only for unmodified upstream use.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "OpenSSL",              # aws-lc-sys (P1+)
  "CDLA-Permissive-2.0",  # webpki-roots data (P3+)
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private (publish = false) workspace crates carry no version by design.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS and crypto are aws-lc-rs only (plan D18)" },
  { crate = "openssl-sys", reason = "TLS and crypto are aws-lc-rs only (plan D18)" },
  { crate = "serde_yaml", reason = "unmaintained; YAML is not a config format here (D17)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
