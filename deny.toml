# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain policy (plan §4.4, T3). Anything not allowed here fails the merge.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Every entry must be compatible with distributing an Apache-2.0 binary. Notices are aggregated in
# NOTICE at release time. MPL-2.0 is file-level copyleft: allowed only for unmodified upstream use.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "OpenSSL",              # aws-lc-sys (P1+)
  "CDLA-Permissive-2.0",  # webpki-roots data (P3+)
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private (publish = false) workspace crates carry no version by design.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS and crypto are aws-lc-rs only (plan D18)" },
  { crate = "openssl-sys", reason = "TLS and crypto are aws-lc-rs only (plan D18)" },
  { crate = "ring", reason = "TLS and crypto are aws-lc-rs only (plan D18; review WP3.A5 L8)" },
  { crate = "serde_yaml", reason = "unmaintained; YAML is not a config format here (D17)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
