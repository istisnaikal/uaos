[[gate]]
id = "gate-selftest"
source = "plan P0 acceptance: every gate shown to fail on a seeded violation"
lane = "merge"
status = "active"
job = "negative"
negative_exempt = "This gate is the harness that proves the others; its own bite is the BROKEN result it reports."

[[gate]]
id = "path-spaces-unicode"
source = "plan P0: build from a path with spaces and ü/ş/ı"
lane = "merge"
status = "active"
job = "paths"
negative_exempt = "Environmental: the job itself is the positive proof on Windows; a seeded failure would require breaking path handling on purpose."

