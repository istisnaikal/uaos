# SPDX-License-Identifier: Apache-2.0
#
# Gate registry (plan §4.2). Validated by `cargo xtask gates` on every merge.
#
#   active  — runs in CI (`job`) and is proven to bite by a seeded violation (`negative`).
#   pending — its subject does not exist yet; `phase` names when it activates. Pending gates
#             never pass vacuously: they block a RELEASE (`cargo xtask gates --release`).
#
# The required sets (CLAUDE.md §4 merge blockers + required behaviors, plan §4.2 additions) are
# hard-coded in xtask/src/gates.rs. Removing an entry requires an ADR. Deviation from CLAUDE.md,
# recorded in ADR-0003: CLAUDE.md lists these as merge blockers from day one; a gate whose
# subject is not built yet is tracked as `pending` instead of being faked green.

# ── fmt / clippy / test ──────────────────────────────────────────────────────────────────
[[gate]]
id = "fmt"
source = "CLAUDE.md §4 CI merge blocker: fmt/clippy/test"
lane = "merge"
status = "active"
job = "fmt"
negative = ["fmt-unformatted"]

[[gate]]
id = "clippy"
source = "CLAUDE.md §4 CI merge blocker: fmt/clippy/test; plan §4.3 code standard"
lane = "merge"
status = "active"
job = "clippy"
negative = ["clippy-unwrap", "clippy-unsafe", "clippy-ambient-clock", "clippy-nondeterministic-map"]

[[gate]]
id = "test"
source = "CLAUDE.md §4 CI merge blocker: fmt/clippy/test"
lane = "merge"
status = "active"
job = "test"
negative = ["test-failure"]

