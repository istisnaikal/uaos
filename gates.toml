[[gate]]
id = "journal-durability"
source = "CLAUDE.md §4 CI merge blocker: journal durability (40 real kills per OS per merge; 10,000 per OS nightly), payloads included (ADR-0018: chunks flushed before the records that reference them, payload before record, one writer per chunk)"
lane = "merge"
status = "active"
job = "test"
negative = [
  "journal-ack-without-write",
  "chunk-flushed-before-sync",
  "intent-before-chunk-write",
  "chunk-put-pair-race",
  "chunk-put-shared-temp",
  "marker-before-loss-report",
  "store-flush-failure-forgotten",
  "recovery-reflushes-same-file",
  "chunk-rewrite-unflushed",
  "chunk-rewrite-new-data-key",
  "loss-flushed-before-report",
  "open-trusts-previous-segment",
  "open-stores-manifest-before-flush",
  "is-stored-trusts-earlier-pair",
  "flush-skips-missing-pending-file",
  "loss-set-aside-after-quarantine",
  "shred-not-completed-at-open",
  "shred-bypasses-journal",
  "shreds-before-manifest-at-open",
  "shred-incomplete-key-only",
  "plain-marker-trusted",
  "put-overlapping-failed-flush",
  "failed-shred-vouched",
  "flush-acked-across-poisoning",
  "shred-marked-after-record",
  "failed-put-lifts-shred-mark",
  "rotation-skips-current-key",
  "store-flush-poisons-outside-window",
  "shred-mark-not-restored",
]

